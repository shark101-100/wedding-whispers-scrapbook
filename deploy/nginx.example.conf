# Пример nginx-конфига для VPS-деплоя.
# Положите как /etc/nginx/sites-available/wedding и сделайте symlink в sites-enabled.
# Обязательно подставьте свой домен и пути к сертификатам.

server {
    listen 80;
    server_name YOUR_DOMAIN;
    # Редирект на HTTPS — после получения сертификата certbot обычно делает это сам.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # ── Прокси на Supabase ──────────────────────────────────────────
    # Браузер бьёт в /sb/... — nginx переписывает на krtbtybinjixvxkeqstx.supabase.co
    # Это обходит блокировки *.supabase.co у части провайдеров.
    location /sb/ {
        proxy_pass https://krtbtybinjixvxkeqstx.supabase.co/;
        proxy_set_header Host krtbtybinjixvxkeqstx.supabase.co;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;

        # Поддержка websockets (Supabase Realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }

    # ── Node SSR (TanStack Start) ───────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
